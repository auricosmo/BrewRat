<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrewRat | Scavenging the Best Indie Coffee</title>
    <!-- Favicon: Rat holding a cup -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>🐀</text><text x=%2240%22 y=%22.9em%22 font-size=%2250%22>☕</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #2b2521; color: #e8d5c4; }
        .cafe-card { background-color: #3d342d; border-color: #4a4036; transition: all 0.3s ease; }
        .cafe-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px -10px rgba(0,0,0,0.6); }
        .intel-badge { background: linear-gradient(135deg, #d97706, #b45309); animation: subtle-pulse 3s infinite; }
        .king-pick-badge { background: linear-gradient(135deg, #fbbf24, #d97706); color: #1a1614; box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4); border: 2px solid #2b2521; }
        @keyframes subtle-pulse { 0%, 100% { box-shadow: 0 0 8px rgba(217, 119, 6, 0.4); } 50% { box-shadow: 0 0 16px rgba(217, 119, 6, 0.7); } }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #2b2521; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #a67c52; border-radius: 10px; }
        .vibe-tag { font-size: 9px; font-weight: 800; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
        .vibe-good { background: rgba(52, 211, 153, 0.1); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.2); }
        .vibe-bad { background: rgba(248, 113, 113, 0.1); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.2); }
    </style>
</head>
<body class="selection:bg-amber-500/30">

    <header class="bg-[#1a1614]/80 backdrop-blur-md border-b border-[#4a4036] sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-amber-900/40 p-2 rounded-xl border border-amber-800/50">
                    <svg width="50" height="50" viewBox="0 0 100 100" class="rat-logo-svg" xmlns="http://www.w3.org/2000/svg">
                        <g transform="translate(-10, -2) scale(1.15)">
                            <path d="M75,70 Q90,70 85,55 Q80,45 65,40 Q50,35 40,45 Q30,55 35,70 L75,70" fill="#a67c52" />
                            <path d="M75,70 Q95,75 90,60" fill="none" stroke="#8c6641" stroke-width="3" stroke-linecap="round" />
                            <circle cx="45" cy="40" r="8" fill="#8c6641" />
                            <path d="M42,32 L39,26 L43,29 L46,24 L49,29 L53,26 L50,32 Z" fill="#fbbf24" stroke="#1a1614" stroke-width="0.5" />
                            <circle cx="42" cy="48" r="2" fill="#1a1614" />
                            <rect x="20" y="55" width="20" height="18" rx="2" fill="#e8d5c4" />
                            <path d="M40,58 Q45,58 45,63 Q45,68 40,68" fill="none" stroke="#e8d5c4" stroke-width="2" />
                            <g opacity="0.6">
                                <path d="M25,50 Q28,45 25,40" fill="none" stroke="#e8d5c4" stroke-width="1.5" />
                                <path d="M32,50 Q35,45 32,40" fill="none" stroke="#e8d5c4" stroke-width="1.5" />
                            </g>
                        </g>
                    </svg>
                </div>
                <div class="flex flex-col">
                    <h1 class="text-2xl font-black text-[#fef3c7] leading-none tracking-tighter">BrewRat</h1>
                    <span class="text-[8px] font-bold uppercase tracking-[0.2em] text-amber-500 mt-1">Specialty Scavenger Guide</span>
                </div>
            </div>
            
            <div class="flex flex-1 max-w-xl w-full relative gap-2">
                <div class="relative flex-1">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-amber-500/30"></i>
                    <input type="text" id="searchInput" placeholder="Search the streets for beans..." 
                        class="w-full pl-11 pr-4 py-2.5 border border-[#4a4036] rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 bg-[#1a1614] text-amber-100 placeholder:text-amber-900 transition-all text-sm">
                </div>
                <button onclick="requestLocation()" id="locateBtn" class="px-4 py-2.5 bg-amber-900/40 border border-amber-800/50 rounded-xl text-amber-500 hover:bg-amber-800/20 transition flex items-center gap-2 whitespace-nowrap text-xs font-black uppercase tracking-widest">
                    <i class="fas fa-crosshairs"></i> <span class="hidden sm:inline">Scan Perimeter</span>
                </button>
            </div>

            <div id="userProfile" class="flex items-center gap-3 bg-amber-950/20 px-4 py-2 rounded-xl border border-amber-900/30 hidden">
                <div class="text-right">
                    <p id="userName" class="text-[10px] font-black uppercase text-amber-100">Scout</p>
                    <div id="userBadges" class="flex gap-1 mt-0.5"></div>
                </div>
                <div class="w-8 h-8 rounded-lg bg-amber-500 flex items-center justify-center text-[#1a1614] font-black text-xs shadow-lg shadow-amber-500/20" id="userRank">0</div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="mb-10 flex flex-col md:flex-row md:items-end justify-between gap-6">
            <div>
                <h2 class="text-3xl font-black text-[#fef3c7] tracking-tight mb-2">The Nest</h2>
                <p class="text-amber-200/40 text-sm max-w-sm">Live community data from the Manila coffee underground.</p>
                <div id="locationBadge" class="hidden mt-3 text-[10px] font-black uppercase text-amber-500/60 flex items-center gap-2">
                    <i class="fas fa-map-marker-alt"></i> GPS Lock Active: Sorting by Proximity
                </div>
            </div>
            <div id="authStatus" class="text-[10px] font-bold uppercase tracking-widest text-amber-500/50 italic">Linking...</div>
        </div>

        <div id="cafeGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        <div id="noResults" class="hidden text-center py-20 text-amber-900/40 font-black uppercase tracking-widest text-xs">Sector clear. No intel found.</div>
    </main>

    <!-- Review Modal -->
    <div id="reviewModal" class="fixed inset-0 bg-[#1a1614]/95 hidden items-center justify-center z-[100] p-4 backdrop-blur-md">
        <div class="bg-[#2b2521] border border-[#4a4036] rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-hidden flex flex-col shadow-2xl">
            <div class="p-6 border-b border-[#4a4036] flex justify-between items-center bg-[#1a1614]/50">
                <h2 id="modalTitle" class="text-2xl font-black text-[#fef3c7]">Cafe</h2>
                <button onclick="closeModal()" class="text-amber-500 hover:text-amber-100 transition"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <div class="overflow-y-auto custom-scrollbar p-6 space-y-8">
                <section class="bg-[#3d342d] p-6 rounded-2xl border border-[#4a4036]">
                    <h3 class="text-[10px] font-black text-amber-500 uppercase tracking-widest mb-4 flex items-center gap-2">
                        <i class="fas fa-signal"></i> Live Vibe Report
                    </h3>
                    <div class="grid grid-cols-3 gap-3">
                        <div class="vibe-selector">
                            <p class="text-[9px] font-bold text-amber-200/50 mb-2 uppercase">WiFi</p>
                            <select id="vibeWifi" class="w-full bg-[#1a1614] border border-[#4a4036] rounded-lg p-2 text-xs text-amber-100">
                                <option value="none">Unknown</option>
                                <option value="good">High Speed</option>
                                <option value="mid">Standard</option>
                                <option value="bad">Dead Zone</option>
                            </select>
                        </div>
                        <div class="vibe-selector">
                            <p class="text-[9px] font-bold text-amber-200/50 mb-2 uppercase">Outlets</p>
                            <select id="vibeOutlets" class="w-full bg-[#1a1614] border border-[#4a4036] rounded-lg p-2 text-xs text-amber-100">
                                <option value="none">Unknown</option>
                                <option value="good">Plenty</option>
                                <option value="bad">None Found</option>
                            </select>
                        </div>
                        <div class="vibe-selector">
                            <p class="text-[9px] font-bold text-amber-200/50 mb-2 uppercase">Crowd</p>
                            <select id="vibeCrowd" class="w-full bg-[#1a1614] border border-[#4a4036] rounded-lg p-2 text-xs text-amber-100">
                                <option value="good">Ghost Town</option>
                                <option value="mid">Active</option>
                                <option value="bad">Full House</option>
                            </select>
                        </div>
                    </div>
                </section>

                <div id="modalReviews" class="space-y-4"></div>

                <div class="bg-[#3d342d] rounded-2xl p-6 border border-[#4a4036]">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-black text-amber-200 uppercase tracking-widest text-xs">Transmit Intel</h3>
                        <div id="starInput" class="flex gap-1 text-amber-500 cursor-pointer">
                            <i class="fas fa-star" data-val="1"></i><i class="fas fa-star" data-val="2"></i><i class="fas fa-star" data-val="3"></i><i class="fas fa-star" data-val="4"></i><i class="fas fa-star" data-val="5"></i>
                        </div>
                    </div>
                    <textarea id="reviewText" placeholder="What's the intel?" class="w-full p-4 border border-[#4a4036] rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 bg-[#1a1614] text-amber-100 h-24 text-sm"></textarea>
                    <button id="submitBtn" onclick="submitReview()" class="w-full mt-4 intel-badge text-white py-3 rounded-xl font-black uppercase tracking-widest text-xs hover:brightness-110 transition">Transmit Intel</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBJhEWSJ8Tz2DBwychFeQVlhXCYD1D8YLY",
            authDomain: "ojt-pulse-tracker-backen-160ad.firebaseapp.com",
            projectId: "ojt-pulse-tracker-backen-160ad",
            storageBucket: "ojt-pulse-tracker-backen-160ad.firebasestorage.app",
            messagingSenderId: "859757491435",
            appId: "1:859757491435:web:0737b9c1f9380628b03aae"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'brew-rat-guide'; 

        let user = null;
        let userData = { scavengeCount: 0, badges: [] };
        let cafes = []; 
        let reviews = [];
        let currentCafeId = null;
        let selectedRating = 5;
        let userLocation = null;

        const init = async () => {
            setupUI();
            onAuthStateChanged(auth, (u) => {
                user = u;
                if (u) {
                    document.getElementById('authStatus').innerText = "LINK ESTABLISHED";
                    document.getElementById('userProfile').classList.remove('hidden');
                    document.getElementById('userName').innerText = `Scout ${u.uid.substring(0,4)}`;
                    syncUserData(u.uid);
                    startSync();
                }
            });
            await signInAnonymously(auth);
        };

        const calculateDistance = (lat1, lon1, lat2, lon2) => {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        };

        window.requestLocation = () => {
            const btn = document.getElementById('locateBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Scanning...';
            
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    document.getElementById('locationBadge').classList.remove('hidden');
                    btn.innerHTML = '<i class="fas fa-check"></i> Scanned';
                    renderCafes();
                },
                (err) => {
                    btn.innerHTML = '<i class="fas fa-times"></i> Scan Failed';
                    alertBox("GPS SIGNAL LOST.");
                }
            );
        };

        const syncUserData = (uid) => {
            if (!user) return;
            const userDoc = doc(db, 'artifacts', appId, 'users', uid, 'profile', 'data');
            onSnapshot(userDoc, (snap) => {
                if (snap.exists()) {
                    userData = snap.data();
                    document.getElementById('userRank').innerText = userData.scavengeCount || 0;
                    renderBadges(userData.badges || []);
                } else {
                    setDoc(userDoc, { scavengeCount: 0, badges: [] });
                }
            }, (err) => console.log("Profile Sync Waiting..."));
        };

        const renderBadges = (badges) => {
            const container = document.getElementById('userBadges');
            container.innerHTML = badges.map(b => `<i class="fas fa-certificate text-[8px] text-amber-500" title="${b}"></i>`).join('');
        };

        const startSync = () => {
            if (!user) return;
            const cafesRef = collection(db, 'artifacts', appId, 'public', 'data', 'cafes');
            const reviewsRef = collection(db, 'artifacts', appId, 'public', 'data', 'reviews');

            onSnapshot(cafesRef, snap => {
                cafes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderCafes();
            }, (err) => console.log("Cafe Sync Waiting..."));

            onSnapshot(reviewsRef, snap => {
                reviews = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderCafes();
                if (currentCafeId) updateModalReviews();
            }, (err) => console.log("Review Sync Waiting..."));
        };

        window.renderCafes = () => {
            const grid = document.getElementById('cafeGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            const cafesWithDistance = cafes.map(c => {
                let dist = null;
                if (userLocation && c.lat && c.lng) {
                    dist = calculateDistance(userLocation.lat, userLocation.lng, Number(c.lat), Number(c.lng));
                }
                return { ...c, distance: dist };
            });

            let filtered = cafesWithDistance.filter(c => !c.isHidden && (c.name?.toLowerCase().includes(search) || c.city?.toLowerCase().includes(search)));

            if (userLocation) {
                filtered.sort((a, b) => {
                    if (a.distance === null) return 1;
                    if (b.distance === null) return -1;
                    return a.distance - b.distance;
                });
            } else {
                filtered.sort((a, b) => (b.isChiefFavorite ? 1 : 0) - (a.isChiefFavorite ? 1 : 0));
            }

            grid.innerHTML = '';
            filtered.forEach(cafe => {
                const cafeReviews = reviews.filter(r => r.cafeId === cafe.id);
                const base = Number(cafe.baseRating || 5.0);
                const rating = cafeReviews.length ? (cafeReviews.reduce((a,b)=>a+b.rating,0)/cafeReviews.length).toFixed(1) : base.toFixed(1);
                const vibes = cafe.lastVibe || { wifi: 'none', outlets: 'none', crowd: 'mid' };
                const distStr = cafe.distance !== null ? `${cafe.distance.toFixed(1)} km away` : null;

                const card = document.createElement('div');
                card.className = 'cafe-card rounded-2xl overflow-hidden border border-[#4a4036] cursor-pointer group flex flex-col';
                card.onclick = () => openModal(cafe.id);
                card.innerHTML = `
                    <div class="relative h-40 bg-[#1a1614] overflow-hidden">
                        <img src="${cafe.image || 'https://images.unsplash.com/photo-1501339819398-ed4986bb5af0?q=80&w=600'}" class="w-full h-full object-cover group-hover:scale-110 transition-transform opacity-70">
                        <div class="absolute top-3 left-3 flex flex-wrap gap-1">
                            ${vibes.wifi === 'good' ? '<span class="vibe-tag vibe-good">Wired</span>' : ''}
                            ${vibes.crowd === 'good' ? '<span class="vibe-tag vibe-good">Ghost Town</span>' : ''}
                            ${distStr ? `<span class="vibe-tag bg-amber-500/10 text-amber-500 border border-amber-500/20">${distStr}</span>` : ''}
                        </div>
                        ${cafe.isChiefFavorite ? '<div class="absolute top-3 right-3 king-pick-badge p-1.5 rounded-lg"><i class="fas fa-crown text-[10px]"></i></div>' : ''}
                    </div>
                    <div class="p-5 flex-1 flex flex-col">
                        <div class="flex justify-between items-start mb-1">
                            <h3 class="font-black text-amber-50 text-lg group-hover:text-amber-500 transition-colors tracking-tight">${cafe.name}</h3>
                            <span class="text-amber-500 font-bold text-xs"><i class="fas fa-star mr-1"></i>${rating}</span>
                        </div>
                        <p class="text-[10px] uppercase font-bold text-amber-200/30 tracking-widest">${cafe.city || 'Metro Area'}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
            document.getElementById('noResults').classList.toggle('hidden', filtered.length > 0);
        };

        window.openModal = (id) => {
            currentCafeId = id;
            const cafe = cafes.find(c => c.id === id);
            if (!cafe) return;
            document.getElementById('modalTitle').innerText = cafe.name;
            document.getElementById('reviewModal').classList.remove('hidden');
            document.getElementById('reviewModal').classList.add('flex');
            updateModalReviews();
        };

        window.submitReview = async () => {
            if (!user) return;
            const text = document.getElementById('reviewText').value.trim();
            if (!text) return;

            const vibes = {
                wifi: document.getElementById('vibeWifi').value,
                outlets: document.getElementById('vibeOutlets').value,
                crowd: document.getElementById('vibeCrowd').value
            };

            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerText = "TRANSMITTING...";

            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'reviews'), {
                    cafeId: currentCafeId,
                    rating: selectedRating,
                    text,
                    user: user.uid,
                    timestamp: serverTimestamp()
                });
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'cafes', currentCafeId), { lastVibe: vibes });
                
                const userDoc = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
                const newCount = (userData.scavengeCount || 0) + 1;
                let badges = [...(userData.badges || [])];
                if (newCount === 1) badges.push("First Intel");
                await updateDoc(userDoc, { scavengeCount: newCount, badges: badges });

                closeModal();
                alertBox("INTEL TRANSMITTED.");
            } catch (e) { console.error(e); } finally {
                btn.disabled = false; btn.innerText = "Transmit Intel";
            }
        };

        const alertBox = (m) => {
            const b = document.createElement('div');
            b.className = 'fixed bottom-10 left-1/2 -translate-x-1/2 bg-amber-500 text-[#1a1614] font-black uppercase text-[10px] px-8 py-4 rounded-full z-[200] border-2 border-[#1a1614]';
            b.innerText = m;
            document.body.appendChild(b);
            setTimeout(() => b.remove(), 4000);
        };

        window.closeModal = () => {
            document.getElementById('reviewModal').classList.add('hidden');
            document.getElementById('reviewText').value = '';
            currentCafeId = null;
        };

        const setupUI = () => {
            document.getElementById('searchInput').oninput = () => renderCafes();
            document.querySelectorAll('#starInput i').forEach(s => s.onclick = () => {
                selectedRating = parseInt(s.dataset.val);
                document.querySelectorAll('#starInput i').forEach((star, i) => {
                    star.className = i < selectedRating ? 'fas fa-star' : 'far fa-star';
                });
            });
        };

        const updateModalReviews = () => {
            const container = document.getElementById('modalReviews');
            const cafeReviews = reviews.filter(r => r.cafeId === currentCafeId).sort((a,b) => (b.timestamp?.seconds||0) - (a.timestamp?.seconds||0));
            container.innerHTML = cafeReviews.map(r => `
                <div class="bg-[#1a1614] p-4 rounded-xl border border-[#4a4036]">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[9px] font-black text-amber-500 uppercase tracking-tighter">Scout ${r.user?.substring(0,4)}</span>
                        <div class="text-amber-600 text-[8px]">${'<i class="fas fa-star"></i>'.repeat(r.rating)}</div>
                    </div>
                    <p class="text-sm text-amber-100/70 italic">"${r.text}"</p>
                </div>
            `).join('');
        };

        init();
    </script>
</body>
</html>
